name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.11.2

jobs:
  schema-contract:
    name: Schema Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Verify canonical schema contract
        run: ./scripts/check_schema_contract.sh

      - name: Verify schema equivalence (Postgres ↔ SQLite)
        run: ./scripts/check_schema_equivalence.sh

  cli:
    name: CLI (Go)
    runs-on: ubuntu-latest
    needs: schema-contract
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cli/go.mod

      - name: Verify go.mod is tidy
        run: go mod tidy -diff

      - name: Build packages
        run: go build ./...

      - name: Build binary
        run: go build -o pc ./cmd/pc

      - name: Enforce coverage >= 95%
        run: ./scripts/check_coverage.sh 95

      - name: Enforce per-package coverage >= 95%
        run: ./scripts/check_coverage_per_package.sh 95

      - name: Run CLI e2e tests
        run: go test ./internal/e2e

      - name: Run Postgres repository integration tests
        run: go test -tags integration ./internal/repository/postgres/ -v -timeout 180s

      - name: Run S3 client integration tests
        run: go test -tags integration ./internal/s3client/ -v -timeout 60s

      - name: Run CLI cloud e2e integration tests
        run: go test -tags integration ./internal/cloude2e/ -v -timeout 420s

      - name: Run linter
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: cli

  release-artifacts:
    name: Release Artifacts
    runs-on: ubuntu-latest
    needs: schema-contract
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cli/go.mod

      - name: Build release artifacts (dry run)
        run: make release-dist PC_VERSION=ci DIST_DIR=dist

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    needs: schema-contract
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: web/package.json

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: cli/go.mod

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage enforcement (>= 95%)
        run: pnpm test:coverage

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Run Playwright smoke e2e
        run: pnpm test:e2e:smoke

      - name: Run Playwright Record Browser e2e
        run: pnpm test:e2e:record-browser

      - name: Run Playwright markdown rendering e2e
        run: pnpm test:e2e:markdown:ci

      - name: Run Playwright standalone CLI record e2e
        run: pnpm test:e2e:cli-record

      - name: Run Playwright local demo e2e
        run: pnpm test:e2e:cli-demo
