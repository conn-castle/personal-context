name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.10

jobs:
  schema-contract:
    name: Schema Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify canonical schema contract
        run: ./scripts/check_schema_contract.sh

  cli:
    name: CLI (Go)
    runs-on: ubuntu-latest
    needs: schema-contract
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod

      - name: Verify go.mod is tidy
        run: go mod tidy -diff

      - name: Build packages
        run: go build ./...

      - name: Build binary
        run: go build -o pc ./cmd/pc

      - name: Enforce coverage >= 95%
        run: ./scripts/check_coverage.sh 95

      - name: Enforce per-package coverage >= 95%
        run: ./scripts/check_coverage_per_package.sh 95

      - name: Run linter
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          working-directory: cli

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    needs: schema-contract
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Enforce coverage >= 95%
        run: npm run test:coverage

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Run Playwright smoke e2e
        run: npm run test:e2e:smoke
